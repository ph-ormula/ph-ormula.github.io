<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 770 125" role="img" aria-label="Example 3×5 game of Chomp">
<style>
	.bg{fill:none}
	.node{fill:#ffffff;stroke:#333333;stroke-width:1.6}
	.lab{fill:#222222;font:16px sans-serif}
	.edge{fill:none;stroke:#333333;stroke-width:1.6}
	.head{fill:#333333}
	.piece{fill:#b0b0b0;stroke:#555555;stroke-width:1.4}
	.poison{fill:#111111;stroke:#111111;stroke-width:1.4}
	.eaten{fill:none;stroke:#888888;stroke-width:1.4;stroke-dasharray:3 3}
	.title{fill:#222222;font:bold 15px sans-serif}
	@media (prefers-color-scheme: dark){
		.node{fill:#1e1e1e;stroke:#dddddd}
		.lab,.title{fill:#eeeeee}
		.edge{stroke:#dddddd}
		.head{fill:#dddddd}
		.piece{fill:#8a8a8a;stroke:#cccccc}
		.poison{fill:#e05050;stroke:#e05050}
		.eaten{stroke:#999999}
	}
</style>
